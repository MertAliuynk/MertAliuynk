name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # her gün gece yarısı otomatik yeniler
  workflow_dispatch:      # manuel calistirma butonu icin
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake game from a GitHub user contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: MertAliuynk
          outputs: |
            dist/github-contribution-grid-snake-dark.svg
            dist/github-contribution-grid-snake.svg

      - name: Push the generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
